{{- if .Values.gateway.enabled | default false }}
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: rocketmq-swimlane-gateway
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    istio: {{ .Values.gateway.istio | default "ingressgateway" }}
  servers:
  - port:
      number: {{ .Values.gateway.port | default 80 }}
      name: http
      protocol: HTTP
    hosts:
    - {{ .Values.gateway.host | default "*" | quote }}
{{- end }}